    <div class="session-heading">
        <h3>This is Victorium</h3>
    </div>
    <form class="testing d-flex flex-row align-items-center">
        <div class="d-flex align-items-end border-info border-end pe-3 border-5 gap-2">
            <select name="row"
                class="form-select form-select-lg w-auto shadow-sm border-primary rounded-3 fw-semibold text-center"
                id="row-selector">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
            </select>
            <select name="col"
                class="form-select form-select-lg w-auto shadow-sm border-primary rounded-3 fw-semibold text-center"
                id="col-selector">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
            </select>
        </div>
        <input type="checkbox" name="land-check" class="btn-check" id="land-check" autocomplete="off">
        <label class="btn btn-outline-success ms-3 me-3" for="land-check" id="land-check-label"
            style="max-height: 60px;">Land</label>
        <div class="d-flex justify-content-center flex-column border-start border-info border-5 ps-3 pe-3 gap-2">

            <p>Territory</p>
            <input type="radio" name="territory" value="red" id="red" class="btn toggle-radio">
            <input type="radio" name="territory" value="blue" id="blue" class="btn toggle-radio">
            <input type="radio" name="territory" value="green" id="green" class="btn toggle-radio">
            <input type="radio" name="territory" value="purple" id="purple" class="btn toggle-radio">
            <input type="radio" name="territory" value="yellow" id="yellow" class="btn toggle-radio">
            <input type="radio" name="territory" value="white" id="white" class="btn toggle-radio">
            <input type="radio" name="territory" value="none" id="none" class="btn btn-lg toggle-radio">
        </div>
        <!-- <input type="checkbox" name="land-check" class="btn checkbox btn-secondary" id="land-check" > -->
        <hr>
        <div class="d-flex flex-column gap-2 me-3">
        <select name="building"
            class="form-select form-select-lg w-auto shadow-sm border-primary rounded-3 fw-semibold text-center"
            id="building">
            <option value="none">none</option>
            <option value="hut">hut</option>
            <option value="lumberyard">lumberyard</option>
            <option value="garden">garden</option>
            <option value="embassy">embassy</option>
            <option value="port">port</option>
            <option value="refinery">refinery</option>
            <option value="quarry">quarry</option>
            <option value="barracks">barracks</option>
            <option value="multicenter">multicenter</option>
            <option value="complex">complex</option>
            <option value="defenseArray">defense Array</option>
            <option value="city">city</option>

        </select>
        <input type="checkbox" name="pop-check" class="btn-check" id="pop-check" autocomplete="off">
        <label class="btn btn-outline-secondary ms-3 me-3" for="pop-check" id="pop-check-label"
            style="max-height: 60px;">pop</label></div>
        <div
            class="d-flex justify-content-center flex-column border-start border-info border-5 ps-3 me-3 gap-0 col-6" style="max-width: 90px;">
            <p class="m-0">army</p>
            <div><input type="radio" name="army-radio" value="red" id="red" class="army-radio">
            <label for="red">red</label>
            </div>
            <div><input type="radio" name="army-radio" value="blue" id="blue" class="army-radio">
            <label for="blue">blue</label></div>
            <div><input type="radio" name="army-radio" value="green" id="green" class="army-radio">
            <label for="green">Green</label></div>
            <div><input type="radio" name="army-radio" value="purple" id="purple" class="army-radio">
            <label for="purple">Purple</label></div>
            <div><input type="radio" name= "army-radio" value="yellow" id="yellow" class="army-radio">
                <label for="yellow">Yellow</label>
            </div>
            <div><input type="radio" name="army-radio"  value="white" id="white" class="army-radio">
                <label for="white">White</label>
            </div>
            <div><input type="radio" name="army-radio"  value="none" id="none" class="army-radio">
                <label for="none">None</label>
            </div>
        </div>
        <!-- <input type="checkbox" name="pop-check" id="pop-check" checked> -->
