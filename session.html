        </div>

  <input type="radio" name="territory" value="purple" id="purple" class="toggle-radio">
  <input type="radio" name="territory" value="yellow" id="yellow" class="toggle-radio">
  <input type="radio" name="territory" value="white"  id="white" class="toggle-radio">

  </div>

        <input type="radio" name="army-radio" value="green"  id="green" class="army-radio">
        <input type="radio" name="army-radio" value="purple" id="purple" class="army-radio">
        <input type="radio" name="army-radio" value="yellow" id="yellow" class="army-radio">
        <input type="radio" name="army-radio" value="white"  id="white" class="army-radio">
        <input type="radio" name="army-radio" value="none"   id="none" class="army-radio">
        <input type="checkbox" name="pop-check" id="pop-check" checked>
